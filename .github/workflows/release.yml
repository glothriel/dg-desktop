name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build executable JAR
        run: |
          mkdir -p build dist
          javac --release 17 -d build src/Main.java
          jar --create --file "dist/dg-desktop-${GITHUB_REF_NAME}.jar" --main-class Main -C build .
      - name: Verify executable JAR and GUI
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
          jar tf "dist/dg-desktop-${GITHUB_REF_NAME}.jar" | grep -Fx 'Main.class'
          unzip -p "dist/dg-desktop-${GITHUB_REF_NAME}.jar" META-INF/MANIFEST.MF | tr -d '\r' | grep -Fx 'Main-Class: Main'
          timeout 30s xvfb-run -a java -jar "dist/dg-desktop-${GITHUB_REF_NAME}.jar" --self-test
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.jar > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "dg-desktop $GITHUB_REF_NAME" --notes "Minimal Operaton testing demo."
